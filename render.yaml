services:
  - type: web
    name: speech-main
    env: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_CACHE_DIR
        value: /opt/render/project/src/models
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-admin-key.json
      - key: NODE_VERSION
        value: 20.18.0
